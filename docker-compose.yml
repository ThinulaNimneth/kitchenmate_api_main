
name: kitchenmate-api

services:
  mongodb:
    image: mongo:7.0
    container_name: kitchenmate-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: 1234
    volumes:
      - kitchenmate_mongo_data:/data/db

volumes:
  kitchenmate_mongo_data: